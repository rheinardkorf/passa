# Copy to config.yml (which is never committed) and fill in your values.

# Passa's domain: auth.<domain> for sign-in, mcp.<domain> for agents. Use a
# domain that hosts nothing else.
domain: example.com

# Sites are served from <site-id>.<siteDomain>. Leave it out to use the domain
# above. A separate domain (example-sites.com, say) is safer: published pages
# run any script, and on the same domain they are same-site with auth., so the
# browser's same-site protections don't separate them. See SECURITY.md.
# siteDomain: example-sites.com

# Region for everything that stores or processes data.
region: ap-southeast-2

# AWS accounts. Production should be separate from dev.
accounts:
  dev: "000000000000"
  prod: "111111111111"

# Admins can manage publishers. Each admin is also a publisher.
admins:
  - you@example.com

# Email sender for magic links (on the domain above, verified in SES).
email:
  from: Passa <no-reply@example.com>

# Lifetimes, in seconds.
lifetimes:
  accessToken: 3600
  refreshToken: 2592000
  siteCookie: 3600
  sessionIdle: 604800
  sessionMax: 2592000
  magicLink: 900
  uploadUrl: 900 # presigned upload URLs from begin_upload

# Limits, in bytes, except files (a count).
limits:
  inlinePublish: 1048576
  site: 104857600
  file: 26214400
  files: 1000

# Sign-in requests (magic-link emails asked for) allowed per email address and
# per IP address in each window of seconds. Requests over the limit get the
# usual response but no email. WAF adds IP limits in front of auth.
rateLimits:
  window: 3600
  signinPerEmail: 5
  signinPerIp: 30

deleteGraceDays: 7

# Scripts, styles and fonts on sites may load only from these hosts.
cdnAllowlist:
  - cdn.jsdelivr.net
  - cdnjs.cloudflare.com
  - unpkg.com
  - fonts.googleapis.com
  - fonts.gstatic.com
