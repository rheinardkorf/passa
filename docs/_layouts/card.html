<div style="display:flex;flex-direction:column;width:100%;height:100%;box-sizing:border-box;padding:56px 72px 0 72px;background:#0b0b0b;color:#f1ede4;font-family:Archivo">
  <div style="display:flex;align-items:center;padding-bottom:28px;border-bottom:4px solid #f1ede4">
    <div style="display:flex;width:30px;height:30px;border-radius:50%;background-image:radial-gradient(circle at 30% 30%, #ff8a5c, #ff4f1f 55%, #d93a0f)"></div>
    <div style="display:flex;margin-left:16px;font-size:32px;font-weight:900;letter-spacing:1px;text-transform:uppercase">{{site.title}}</div>
    <div style="display:flex;margin-left:auto;padding:6px 14px;background:#ff4f1f;color:#0b0b0b;font-family:JetBrainsMono;font-size:20px;font-weight:500;letter-spacing:3px">DOCS</div>
  </div>
  <div style="display:flex;flex-direction:column;justify-content:center;flex-grow:1">
    <div style="display:block;line-clamp:3;font-size:92px;font-weight:900;line-height:1;letter-spacing:-2px">{{title}}</div>
    {{#description}}<div style="display:block;line-clamp:2;margin-top:32px;padding-left:24px;border-left:6px solid #ff4f1f;font-size:30px;font-weight:700;line-height:1.3;color:#b9b4aa">{{description}}</div>{{/description}}
  </div>
  <div style="display:flex;height:22px;margin:0 -72px;background:#ff4f1f"></div>
</div>
