<style>
:root{--bg:#ffffff;--side:#f7f6f3;--fg:#1c1c1e;--muted:#6b6b72;--line:#e7e5df;--accent:#b4531f;--accent-bg:#fbefe7;--code-bg:#f5f3ee;--note:#2f6fb3;--tip:#2f8a5b;--warning:#b7791f;--danger:#b33a3a;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--side:#18181b;--fg:#e9e7e2;--muted:#9c9ca3;--line:#2a2a2f;--accent:#ef8a4c;--accent-bg:#2a1d15;--code-bg:#1c1c20;--note:#6aa7e8;--tip:#5fc58f;--warning:#e2b04a;--danger:#e57373}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:4.5rem}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 var(--sans)}
a{color:var(--accent);text-underline-offset:.18em}

/* Top bar */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:1rem;height:3.5rem;padding:0 1.25rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--fg);text-decoration:none;font-weight:700;font-size:1.05rem}
.brand .docs{color:var(--muted);font-weight:500}
.mark{width:1.1rem;height:1.1rem;border-radius:4px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#f3c06b))}
.repo{margin-left:auto;color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500}
.repo:hover{color:var(--fg)}

/* Layout */
.layout{display:grid;grid-template-columns:16rem minmax(0,1fr) 14rem;max-width:84rem;margin:0 auto}
.side{position:sticky;top:3.5rem;align-self:start;height:calc(100vh - 3.5rem);overflow-y:auto;padding:1.75rem 1rem 2rem 1.25rem;border-right:1px solid var(--line);background:var(--side)}
.main{min-width:0;padding:2.5rem 3rem 4rem}
.doc{max-width:46rem}
.toc{position:sticky;top:3.5rem;align-self:start;max-height:calc(100vh - 3.5rem);overflow-y:auto;padding:2.5rem 1.25rem 2rem 0;font-size:.85rem}
.toc p{margin:0 0 .5rem;font-weight:600;color:var(--fg)}
.toc ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc li a{display:block;padding:.2rem 0 .2rem .8rem;color:var(--muted);text-decoration:none;line-height:1.4}
.toc li.l3 a{padding-left:1.6rem}
.toc li a:hover{color:var(--fg)}

/* Sidebar */
.section{margin-bottom:1.5rem}
.section-title{margin:0 0 .35rem .6rem;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sections ul{list-style:none;margin:0;padding:0}
.sections a{display:block;padding:.3rem .6rem;border-radius:6px;color:var(--fg);text-decoration:none;font-size:.92rem;line-height:1.4}
.sections a:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.sections a[aria-current]{background:var(--accent-bg);color:var(--accent);font-weight:600}

/* Phone and tablet menu */
.menu{display:none}
.menu summary{cursor:pointer;list-style:none;padding:.35rem .7rem;border:1px solid var(--line);border-radius:6px;font-size:.9rem;font-weight:500}
.menu summary::-webkit-details-marker{display:none}
.menu[open] .sections{position:absolute;left:0;right:0;top:3.5rem;max-height:calc(100vh - 3.5rem);overflow-y:auto;padding:1.25rem;background:var(--side);border-bottom:1px solid var(--line)}
@media (max-width:1200px){.layout{grid-template-columns:15rem minmax(0,1fr)}.toc{display:none}}
@media (max-width:820px){
  .layout{display:block}.side{display:none}.menu{display:block}
  .main{padding:1.75rem 1.25rem 3rem}
}

/* Content */
.doc h1,.doc h2,.doc h3,.doc h4{line-height:1.25;letter-spacing:-.015em;margin:2.4rem 0 .75rem}
.doc h1{font-size:2.15rem;margin-top:0}
.doc h2{font-size:1.45rem;padding-top:.4rem;border-top:1px solid var(--line)}
.doc h1+p{font-size:1.12rem;color:var(--muted)}
.doc h3{font-size:1.12rem}
.doc img{max-width:100%;height:auto;border-radius:8px}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.5rem 0}
.doc blockquote{margin:1.25rem 0;padding:.1rem 1.1rem;border-left:3px solid var(--line);color:var(--muted)}
code,pre{font:.87em/1.6 var(--mono)}
:not(pre)>code{background:var(--code-bg);border:1px solid var(--line);padding:.05em .35em;border-radius:5px;white-space:nowrap}
td code,th code{white-space:normal}
pre{background:var(--code-bg);border:1px solid var(--line);padding:.9rem 1.1rem;border-radius:8px;overflow-x:auto;position:relative}
pre.mermaid{background:none;border:0;text-align:center}
table{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto;margin:1.25rem 0}
th,td{border-bottom:1px solid var(--line);padding:.55rem .75rem;text-align:left;vertical-align:top}
th{font-weight:600;border-bottom-width:2px}
li.task{list-style:none;margin-left:-1.3rem}
.callout{border:1px solid color-mix(in srgb,var(--note) 30%,transparent);border-left:4px solid var(--note);background:color-mix(in srgb,var(--note) 7%,transparent);color:var(--fg);border-radius:8px;padding:.5rem 1.1rem;margin:1.5rem 0}
.callout-title{font-weight:600;margin:.4rem 0}
.callout-tip,.callout-success{border-color:color-mix(in srgb,var(--tip) 30%,transparent);border-left-color:var(--tip);background:color-mix(in srgb,var(--tip) 7%,transparent)}
.callout-warning,.callout-caution{border-color:color-mix(in srgb,var(--warning) 30%,transparent);border-left-color:var(--warning);background:color-mix(in srgb,var(--warning) 8%,transparent)}
.callout-danger,.callout-important{border-color:color-mix(in srgb,var(--danger) 30%,transparent);border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,transparent)}
.footnotes{font-size:.9em;color:var(--muted)}

/* Previous and next */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:46rem;margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.pager a{display:block;padding:.8rem 1rem;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;font-weight:600}
.pager a:hover{border-color:var(--accent)}
.pager span{display:block;font-size:.78rem;font-weight:500;color:var(--muted)}
.pager .next{grid-column:2;text-align:right}

/* Widgets */
.w-cards{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.9rem;margin:1.75rem 0}
.w-card{border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;transition:border-color .15s}
.w-card:hover{border-color:var(--accent)}
.w-card-title{font-weight:600;margin:0 0 .3rem}.w-card-title a{text-decoration:none}
.w-card-text{margin:0;color:var(--muted);font-size:.92rem;line-height:1.55}
.w-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.9rem;margin:1.5rem 0}
.w-stat{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem}.w-stat dt{color:var(--muted);font-size:.85rem}.w-stat dd{margin:0;font-weight:700;font-size:1.8rem;line-height:1.2}
.w-chart{margin:1.75rem 0;color:var(--accent)}.w-chart-axis{fill:var(--muted)}
.w-chart figcaption{color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:.4rem}.w-chart-legend{font-size:.85rem;margin:.3rem 0}
.w-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem;margin:1.5rem 0}.w-gallery figure{margin:0}
.w-gallery img{aspect-ratio:4/3;object-fit:cover;width:100%}.w-gallery figcaption{color:var(--muted);font-size:.8rem;margin-top:.25rem}
.w-timeline{list-style:none;padding:0;border-left:2px solid var(--line);margin:1.5rem 0 1.5rem .4rem}
.w-timeline li{padding:0 0 .9rem 1.1rem;position:relative}.w-timeline li::before{content:"";position:absolute;left:-.42rem;top:.5rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--accent)}
.w-when{display:block;font-weight:600;font-size:.85rem;color:var(--muted)}

/* Code highlighting */
.hljs-comment,.hljs-quote{color:var(--muted);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:#a2477f}
.hljs-string,.hljs-attr,.hljs-template-tag{color:#2f8a5b}
.hljs-number,.hljs-literal,.hljs-type{color:#b7791f}
.hljs-title,.hljs-section,.hljs-name,.hljs-tag{color:#2f6fb3}
@media (prefers-color-scheme:dark){.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:#e389c2}.hljs-string,.hljs-attr{color:#7fd6a6}.hljs-number,.hljs-literal,.hljs-type{color:#e8c06a}.hljs-title,.hljs-section,.hljs-name,.hljs-tag{color:#7fb4ee}}
</style>
