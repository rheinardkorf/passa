<style>
/* Passa docs theme in the BOLD style: poster type, heavy rules, blood-orange accent, paper and ink. */
:root {
  --accent: #ff4f1f;
  --bg: #f3efe6;
  --bg-2: #e9e4d8;
  --bg-3: #ded8ca;
  --ink: #0d0d0d;
  --ink-2: #45423d;
  --ink-3: #77736b;
  --rule: #0d0d0d;
  --hair: rgb(13 13 13 / .14);
  --code-bg: #111111;
  --on-accent: #0b0b0b;
  --gutter: clamp(16px, 4vw, 48px);
  --side: 15.5rem;
  --rail: 13.5rem;
  --measure: 46rem;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0b0b;
    --bg-2: #151515;
    --bg-3: #1f1f1f;
    --ink: #f1ede4;
    --ink-2: #b9b4aa;
    --ink-3: #7d786f;
    --rule: #f1ede4;
    --hair: rgb(241 237 228 / .14);
    --code-bg: #141414;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 5.5rem; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--display); font-size: 1.0625rem; line-height: 1.6;
  overflow-x: clip; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--on-accent); }
img, video, iframe, embed { max-width: 100%; height: auto; }
img { display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--on-accent); padding: .5rem 1rem; z-index: 20; }
.skip:focus { left: 1rem; }

/* ---------- Masthead ---------- */
.masthead {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .9rem var(--gutter);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--rule);
}
.sitename {
  display: inline-flex; align-items: center; gap: .6rem;
  font-weight: 900; font-stretch: 125%; text-transform: uppercase;
  letter-spacing: -.01em; font-size: 1.1rem; text-decoration: none; white-space: nowrap;
}
.dot { width: .85em; height: .85em; border-radius: 50%; flex: none; background: radial-gradient(circle at 30% 30%, #ff8a5c, var(--accent) 55%, #d93a0f); }
.masthead-end { display: flex; align-items: center; gap: .4rem; }
.btn {
  font-family: var(--mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .07em;
  text-decoration: none; padding: .38rem .7rem; border: 1.5px solid var(--ink); cursor: pointer;
  list-style: none; user-select: none; white-space: nowrap;
}
.btn::-webkit-details-marker { display: none; }
.btn:hover { background: var(--ink); color: var(--bg); }

/* Phone menu */
.menu { position: static; }
.menu[open] > summary { background: var(--ink); color: var(--bg); }
.menu-panel {
  position: absolute; left: 0; right: 0; top: 100%;
  max-height: calc(100vh - 4rem); overflow-y: auto;
  background: var(--bg); border-bottom: 3px solid var(--rule);
  padding: 1.25rem var(--gutter) 1.75rem;
  box-shadow: 0 10px 0 var(--accent);
}

/* ---------- Shell ---------- */
.shell {
  display: grid; grid-template-columns: minmax(0, 1fr);
  max-width: 88rem; margin: 0 auto; padding: 0 var(--gutter);
}
.sidebar, .toc { display: none; }
.main { min-width: 0; padding: clamp(2rem, 5vw, 3.5rem) 0 clamp(2rem, 6vw, 4rem); }
@media (min-width: 900px) {
  .menu { display: none; }
  .shell { grid-template-columns: var(--side) minmax(0, 1fr); column-gap: clamp(2rem, 4vw, 4rem); }
  .sidebar {
    display: block; position: sticky; top: 3.75rem; align-self: start;
    max-height: calc(100vh - 3.75rem); overflow-y: auto;
    padding: 2.25rem 0 3rem;
  }
  .main { max-width: var(--measure); }
}
@media (min-width: 1240px) {
  .shell { grid-template-columns: var(--side) minmax(0, var(--measure)) var(--rail); justify-content: space-between; }
  .toc {
    display: block; position: sticky; top: 3.75rem; align-self: start;
    max-height: calc(100vh - 3.75rem); overflow-y: auto; padding: 2.25rem 0 3rem;
    font-size: .86rem; line-height: 1.35;
  }
}

/* ---------- Sidebar nav ---------- */
.sidenav { display: flex; flex-direction: column; gap: 1.75rem; }
.nav-section ul, .nav-loose { list-style: none; margin: 0; padding: 0; }
.nav-heading {
  display: flex; align-items: baseline; gap: .6rem;
  margin: 0 0 .25rem; padding-bottom: .5rem; border-bottom: 2px solid var(--rule);
  font-family: var(--mono); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em;
}
.nav-num { color: var(--accent); }
.sidenav a {
  display: block; padding: .45rem .6rem; margin: 0 -.6rem;
  text-decoration: none; color: var(--ink-2); font-size: .95rem; line-height: 1.3;
  border-bottom: 1px solid var(--hair);
}
.sidenav li:last-child a { border-bottom: 0; }
.sidenav a:hover { color: var(--ink); background: var(--bg-2); }
.sidenav a[aria-current="page"] {
  background: var(--ink); color: var(--bg); font-weight: 800; border-bottom-color: transparent;
  box-shadow: 5px 5px 0 var(--accent);
}

/* ---------- On this page ---------- */
.toc-title { font-family: var(--mono); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 0 0 .25rem; padding-bottom: .5rem; border-bottom: 2px solid var(--rule); }
.toc ol { list-style: none; margin: 0; padding: 0; counter-reset: t; }
.toc li { margin: 0; }
.toc a { display: block; padding: .45rem 0; text-decoration: none; color: var(--ink-2); border-bottom: 1px solid var(--hair); }
.toc a:hover { color: var(--ink); }
.toc .toc-l2 { counter-increment: t; }
.toc .toc-l2 a::before { content: counter(t, decimal-leading-zero); font-family: var(--mono); font-size: .7rem; font-weight: 600; color: var(--accent); margin-right: .6rem; }
.toc .toc-l3 a { padding-left: 1.9rem; font-size: .8rem; }

/* ---------- Kicker + title ---------- */
.kicker {
  display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; align-items: center; margin: 0 0 1.5rem;
  font-family: var(--mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2);
}
.kicker:empty { display: none; }
.kicker-kind { background: var(--accent); color: var(--on-accent); padding: .2rem .55rem; font-weight: 600; }

/* ---------- Prose ---------- */
.prose { font-size: 1.0625rem; line-height: 1.7; counter-reset: sec; }
.prose > * { margin-top: 0; margin-bottom: 1.3rem; min-width: 0; }
.prose p, .prose li { overflow-wrap: break-word; }
.prose > h1 {
  font-weight: 900; font-stretch: 112%;
  font-size: clamp(2.5rem, 6vw, 4.75rem); line-height: .92; letter-spacing: -.035em;
  margin: 0 0 1.75rem; text-wrap: balance; overflow-wrap: anywhere; hyphens: auto;
}
.is-home .prose > h1 { font-stretch: 125%; text-transform: uppercase; font-size: clamp(3.2rem, 11vw, 8rem); line-height: .84; letter-spacing: -.05em; }
.prose > h1 + p { font-size: clamp(1.2rem, 2vw, 1.45rem); line-height: 1.38; color: var(--ink-2); padding-left: 1.25rem; border-left: 6px solid var(--accent); margin-bottom: 2rem; }
.prose a { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.prose a:hover { background: var(--accent); color: var(--on-accent); text-decoration: none; }
.prose strong { font-weight: 750; }
.prose h2, .prose h3, .prose h4 { font-weight: 850; line-height: 1.08; letter-spacing: -.02em; text-wrap: balance; }
.prose h2 { counter-increment: sec; font-size: clamp(1.7rem, 3.2vw, 2.3rem); font-stretch: 110%; margin: 3.25rem 0 1.1rem; padding-top: 1rem; border-top: 3px solid var(--rule); }
.prose h2::before { content: counter(sec, decimal-leading-zero); display: block; margin-bottom: .6rem; font-family: var(--mono); font-size: .78rem; font-weight: 600; letter-spacing: .1em; color: var(--accent); }
.prose h3 { font-size: 1.3rem; margin: 2.25rem 0 .7rem; }
.prose h4 { font-size: 1rem; margin: 1.75rem 0 .5rem; text-transform: uppercase; letter-spacing: .03em; }
.prose ul, .prose ol { padding-left: 1.4rem; }
.prose li { margin: .35rem 0; }
.prose li::marker { color: var(--accent); font-weight: 700; }
.prose hr { border: 0; height: 3px; background: var(--rule); margin: 3rem 0; }
.prose img { border: 2px solid var(--rule); }
.prose s { color: var(--ink-3); }

/* Code */
.prose :not(pre) > code {
  font-family: var(--mono); font-size: .84em;
  background: var(--bg-2); padding: .12em .38em; border: 1px solid var(--hair); overflow-wrap: anywhere;
}
.prose h2 code, .prose h3 code { font-size: .88em; background: none; border: 0; padding: 0; color: var(--accent); }
.prose a code { background: none; }
.prose pre {
  position: relative; margin: 0 0 1.8rem; padding: 1.25rem 1.4rem;
  background: var(--code-bg); color: #ece8df; border-left: 6px solid var(--accent);
  overflow-x: auto; font-family: var(--mono); font-size: .85rem; line-height: 1.65; tab-size: 4;
}
.prose pre[data-lang] { padding-top: 2.3rem; }
.prose pre[data-lang]::before {
  content: attr(data-lang); position: absolute; top: 0; right: 0;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--mono); font-size: .66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; padding: .25rem .6rem;
}
.prose pre code { font-family: inherit; background: none; padding: 0; border: 0; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type { color: #ff7a4d; }
.hljs-string, .hljs-attr, .hljs-template-variable { color: #c6e77a; }
.hljs-comment, .hljs-quote, .hljs-meta { color: #8a857c; font-style: italic; }
.hljs-title, .hljs-section { color: #ffd166; font-weight: 600; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-variable, .hljs-bullet { color: #8ecbff; }
.hljs-params { color: #ece8df; }
.hljs-name, .hljs-tag, .hljs-selector-class, .hljs-selector-id { color: #ff9ec7; }
.hljs-addition { color: #c6e77a; } .hljs-deletion { color: #ff6b6b; }
.prose pre.mermaid { background: var(--bg-2); color: var(--ink); border: 2px solid var(--rule); display: flex; justify-content: safe center; padding: 2rem 1rem; font-family: var(--display); }

/* Quotes + callouts */
.prose blockquote {
  margin-left: 0; margin-right: 0; padding: .25rem 0 .25rem 1.5rem;
  border-left: 6px solid var(--accent);
  font-size: clamp(1.2rem, 2.2vw, 1.45rem); line-height: 1.38; font-weight: 500; letter-spacing: -.01em;
}
.prose blockquote p { margin: 0 0 .75rem; }
.prose blockquote > :last-child { margin-bottom: 0; }
.prose blockquote.callout {
  --c: var(--accent);
  font-size: 1rem; line-height: 1.6; font-weight: 400; letter-spacing: 0;
  padding: 1.1rem 1.3rem; margin-right: 6px; border: 2px solid var(--rule); border-left: 10px solid var(--c);
  background: var(--bg-2); box-shadow: 6px 6px 0 var(--c);
}
.prose .callout-title { font-family: var(--mono); font-size: .76rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--c); margin-bottom: .45rem; }
.callout-tip, .callout-success { --c: #2fbf71 !important; }
.callout-warning, .callout-caution { --c: #f5b700 !important; }
.callout-danger, .callout-error, .callout-bug { --c: #ff3b3b !important; }
.callout-info, .callout-note, .callout-abstract { --c: #3d8bff !important; }

/* Tables */
.prose table { border-collapse: collapse; width: 100%; font-size: .93rem; display: block; overflow-x: auto; }
@media (min-width: 700px) { .prose table { display: table; } }
.prose th { text-align: left; font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; background: var(--ink); color: var(--bg); padding: .6rem .9rem; }
.prose td { padding: .65rem .9rem; border-bottom: 1.5px solid var(--rule); vertical-align: top; }
.prose td code { white-space: nowrap; overflow-wrap: normal; }
.prose tbody tr:hover td { background: var(--bg-2); }

/* Tasks, wikilinks, footnotes */
.prose li.task { list-style: none; margin-left: -1.4rem; padding-left: 1.8rem; position: relative; }
.prose li.task input { appearance: none; width: 1.05rem; height: 1.05rem; margin: 0; border: 2px solid var(--ink); position: absolute; left: 0; top: .38em; }
.prose li.task input:checked { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--bg); }
.wikilink.missing { color: var(--ink-3); text-decoration: line-through dotted; }
.prose section.footnotes { font-size: .9rem; color: var(--ink-2); border-top: 3px solid var(--rule); padding-top: 1rem; margin-top: 2rem; }

/* ---------- Widgets ---------- */
.prose > .w-cards {
  list-style: none; padding: 0; margin: .5rem 0 2.5rem; counter-reset: tile;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
  border-top: 3px solid var(--rule); border-left: 3px solid var(--rule);
}
.w-card {
  counter-increment: tile; position: relative;
  display: flex; flex-direction: column; gap: .5rem;
  margin: 0 !important; padding: 1.25rem 1.35rem 1.4rem; min-height: 11.5rem;
  border-right: 3px solid var(--rule); border-bottom: 3px solid var(--rule);
  font-size: .95rem; line-height: 1.45; color: var(--ink-2);
  transition: background .15s, color .15s;
}
.w-card::before { content: counter(tile, decimal-leading-zero); font-family: var(--mono); font-size: .78rem; font-weight: 600; color: var(--accent); margin-bottom: auto; }
.w-card p { margin: 0; }
.w-card-title { color: var(--ink); font-weight: 900; font-stretch: 115%; font-size: clamp(1.3rem, 2vw, 1.6rem); line-height: 1; letter-spacing: -.03em; margin-top: 1.5rem !important; text-wrap: balance; }
.prose .w-card-title a { text-decoration: none; }
.w-card-title a::after { content: ""; position: absolute; inset: 0; }
.prose .w-card-title a:hover { background: none; color: inherit; }
.w-card:has(a):hover { background: var(--accent); color: var(--on-accent); }
.w-card:has(a):hover::before, .w-card:has(a):hover .w-card-title { color: var(--on-accent); }

.prose > .w-stats {
  margin: .5rem 0 2.5rem;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr));
  border-top: 3px solid var(--rule);
}
.w-stat { display: flex; flex-direction: column-reverse; justify-content: flex-end; padding: 1.25rem 1.25rem 1.25rem 0; border-bottom: 1.5px solid var(--hair); }
.w-stat + .w-stat { padding-left: 1.25rem; border-left: 1.5px solid var(--hair); }
.w-stat dd { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(2.8rem, 5.5vw, 4.5rem); line-height: .85; letter-spacing: -.05em; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.w-stat dt { margin-top: .75rem; font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
@media (max-width: 560px) {
  .prose > .w-stats { grid-template-columns: minmax(0, 1fr); }
  .w-stat, .w-stat + .w-stat { padding-left: 0; border-left: 0; flex-direction: row-reverse; justify-content: flex-end; align-items: baseline; gap: 1rem; }
  .w-stat dd { font-size: 2.6rem; }
  .w-stat dt { margin: 0; }
}

.prose > .w-chart { margin: .5rem 0 2.5rem; color: var(--accent); border-top: 3px solid var(--rule); padding-top: .75rem; }
.w-chart svg { width: 100%; height: auto; }
.w-chart figcaption { margin-bottom: 1rem; font-weight: 850; font-size: 1.2rem; line-height: 1.15; letter-spacing: -.02em; color: var(--ink); }
.w-chart-axis { fill: var(--ink-2); fill-opacity: 1; font-family: var(--mono); }
.w-chart-grid { stroke: var(--ink); }
.w-series-1 { color: var(--accent); opacity: 1; }
.w-series-2 { color: var(--ink); opacity: 1; }
.w-series-3 { color: var(--ink-3); opacity: 1; }
.w-chart-line .w-chart-series circle { stroke: var(--bg); stroke-width: 2; }
.w-chart-line .w-chart-series polyline { stroke-width: 4; }
.w-chart-legend { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; margin: .75rem 0 0; font-family: var(--mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.w-chart-legend li { margin: 0; color: var(--ink); display: flex; align-items: center; }
.w-swatch { display: inline-block; width: 1.1rem; height: .7rem; margin-right: .5rem; background: currentColor; }

.prose > .w-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 12px; }
.w-gallery figure { margin: 0; }
.w-gallery figcaption { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; margin-top: .4rem; color: var(--ink-2); }
.prose > .w-timeline { list-style: none; padding: 0; border-top: 3px solid var(--rule); }
.w-timeline li { display: flex; gap: 1.25rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--hair); margin: 0; }
.w-when { font-weight: 900; font-stretch: 125%; font-size: 1.6rem; color: var(--accent); letter-spacing: -.03em; min-width: 5rem; }

/* ---------- Pager ---------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3.5rem; padding-top: 1.75rem; border-top: 3px solid var(--rule); }
.pager:not(:has(a)) { display: none; }
.pager a { display: flex; flex-direction: column; gap: .5rem; padding: 1.2rem 1.35rem; border: 3px solid var(--rule); text-decoration: none; min-width: 0; transition: background .15s, color .15s, transform .15s, box-shadow .15s; }
.pager-next { text-align: right; grid-column: 2; }
.pager-label { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.pager-title { font-weight: 850; font-stretch: 110%; font-size: clamp(1.1rem, 2vw, 1.4rem); line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere; }
.pager a:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pager a:hover .pager-label { color: inherit; }

/* ---------- Footer: an inverted slab ---------- */
.footer { background: var(--ink); color: var(--bg); overflow: hidden; }
.footer-inner { max-width: 88rem; margin: 0 auto; padding: clamp(2.5rem, 6vw, 4.5rem) var(--gutter) 2.5rem; }
.footer-big { margin: 0 0 2.25rem; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(3rem, 12vw, 9rem); line-height: .82; letter-spacing: -.055em; overflow-wrap: anywhere; }
.footer-big a { text-decoration: none; }
.footer-cols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 2rem; border-top: 2px solid var(--bg); padding-top: 1.5rem; align-items: start; }
.footer-desc { margin: 0; font-size: 1.05rem; line-height: 1.45; max-width: 26rem; }
.footer-nav, .footer-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; font-family: var(--mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.footer a { text-decoration: none; }
.footer-nav a:hover, .footer-links a:hover { color: var(--accent); }
@media (max-width: 760px) { .footer-cols { grid-template-columns: 1fr; } }

@media (max-width: 600px) {
  .w-card { min-height: 8.5rem; }
  .pager { grid-template-columns: 1fr; }
  .pager-next { grid-column: auto; }
  .prose pre { margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter)); }
}
</style>
