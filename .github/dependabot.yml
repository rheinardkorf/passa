version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      # The AWS SDK's packages move together: mixed versions break their types
      # (a lone client-s3 bump did) and the SigV4a signer needs one copy.
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
      dev-tools:
        dependency-type: development
    ignore:
      # Types must match the Node.js runtime (24 LTS, as on Lambda).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1. Lift when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # CodeQL's init and analyze must be the same version, so one PR for both.
      actions:
        patterns: ["*"]
