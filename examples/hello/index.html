<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello from Passa</title>
<link rel="stylesheet" href="style.css">
<h1>Hello from Passa</h1>
<p>This page is private. Only its owner can open it.</p>
<p id="checks"></p>
<script>
  // Inline scripts run, but they can't send data anywhere.
  fetch('https://example.com/').then(
    () => { document.getElementById('checks').textContent = 'Outbound request allowed (unexpected).'; },
    () => { document.getElementById('checks').textContent = 'Outbound request blocked by the content security policy.'; },
  );
</script>
</html>
